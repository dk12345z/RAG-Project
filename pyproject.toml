[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragproject"
version = "0.1.0"
description = "A small retrieval layer for the context-engineering lab (chunking, embeddings, retrieval, prompt versioning)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
]

[tool.setuptools]
packages = ["ragproject"]

[tool.pytest.ini_options]
testpaths = ["tests"]
